[package]
name = "padwire"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
audio_thread_priority = "0.38.0"
cpal = { version = "0.18.2", features = ["pipewire"] }
crossbeam-channel = "0.5.17"
env_logger = "0.11.11"
flate2 = "1.1.10"
gtk4 = { version = "0.11", features = ["v4_18"] }
libadwaita = { version = "0.9", features = ["v1_7"] }
libc = "0.2.190"
log = "0.4.34"
midir = "0.11.1"
midly = "0.5.3"
quick-xml = "0.42.0"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "aiff", "caf", "isomp4", "aac", "alac", "pcm", "adpcm"] }
thiserror = "2"
toml = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
